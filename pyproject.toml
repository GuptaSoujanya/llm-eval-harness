[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.2.1"
description = "Extensible, production-grade LLM evaluation harness for open-source models and APIs."
readme = "README.md"
authors = [{ name = "Soujanya Gupta", email = "soujanya.gupta@ethara.ai" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.0"]
transformers = ["transformers>=4.40.0", "torch>=2.1.0", "accelerate>=0.28.0"]
dev = ["pytest>=7.0.0", "ruff>=0.3.0", "mypy>=1.9.0"]

[project.scripts]
llm-eval = "eval_harness.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
